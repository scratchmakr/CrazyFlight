name = "survivebrainrots/floor"
version = "0.1.0"

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Vide = { name = "centau/vide", version = "^0.4.0" }
gt = { name = "corecii/greentea", version = "^0.4.11" }
Conch = { name = "alicesaidhi/conch", version = "^0.4.0-rc.5" }
ConchUi = { name = "alicesaidhi/conch_ui", version = "^0.4.0-rc.5" }

# Wally dependencies
BezierTween = { wally = "arxkdev/beziertween", version = "0.0.3" }
Lyra = { wally = "paradoxum-games/lyra", version = "^0.6.0" }
Charm = { wally = "littensy/charm", version = "^0.11.0-rc.3" }
CharmSync = { wally = "littensy/charm-sync", version = "^0.4.0-rc.6" }
VideCharm = { wally = "littensy/vide-charm", version = "^0.4.0-rc.5" }
Promise = { wally = "howmanysmall/typed-promise", version = "^4.0.6" }
Red = { wally = "red-blox/red", version = "^2.3.0" }
Signal = { wally = "sleitnick/signal", version = "2.0.1" }
Fusion = { wally = "elttob/fusion", version = "0.2.0" }
RblxUtils = { wally = "raphtalia/rbxutils", version = "1.0.0"}
Spring = { wally = "arxkdev/spring", version = "0.0.3" }
CameraShaker = { wally = "encrxyptedethan/camerashaker", version = "1.0.0" }
TopbarPlus = { wally = "1foreverhd/topbarplus", version = "3.4.0" }
Trove = { wally = "sleitnick/trove", version = "1.8.0" }
Loader = { wally = "sleitnick/loader", version = "2.0.0"}
Satchel = { wally = "ryanlua/satchel", version = "1.4.1" }

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.7.0", target = "lune" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[patches]
"wally#ryanlua/satchel" = { "1.4.1 roblox" = "patches/wally#ryanlua+satchel-1.4.1+roblox.patch" }

# [patches]
# "wally#paradoxum-games/lyra" = { "0.6.0 roblox" = "patches/wally#paradoxum-games+lyra-0.6.0+roblox.patch" }